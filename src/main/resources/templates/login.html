<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Black Wolf Cinema - Iniciar Sesión</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <style>
            .login-card {
                background: white;
                border-radius: 12px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                padding: 2.5rem;
                width: 100%;
                max-width: 420px;
                backdrop-filter: blur(10px);
            }

            .login-card h1 {
                color: #1A2C50;
                margin-bottom: 0.5rem;
                font-size: 1.8rem;
                font-weight: 800;
            }

            .login-card .subtitle {
                color: #666;
                margin-bottom: 2rem;
                font-size: 0.95rem;
            }

            .form-group {
                margin-bottom: 1.5rem;
                text-align: left;
            }

            .form-group label {
                display: block;
                margin-bottom: 0.5rem;
                color: #1A2C50;
                font-weight: 600;
                font-size: 0.95rem;
            }

            .form-group input {
                width: 100%;
                height: 40px;
                border-radius: 8px;
                border: 1.5px solid #ddd;
                padding: 0 12px;
                font-family: "Montserrat", sans-serif;
                font-size: 0.95rem;
                transition: all 0.3s ease;
            }

            .form-group input:focus {
                outline: none;
                border-color: #1A2C50;
                box-shadow: 0 0 0 4px rgba(26, 44, 80, 0.1);
                background-color: #fafbfc;
            }

            .error-alert {
                background-color: #fee;
                color: #c33;
                border: 1px solid #fcc;
                border-radius: 8px;
                padding: 1rem;
                margin-bottom: 1.5rem;
                font-size: 0.9rem;
            }

            .success-alert {
                background-color: #efe;
                color: #3c3;
                border: 1px solid #cfc;
                border-radius: 8px;
                padding: 1rem;
                margin-bottom: 1.5rem;
                font-size: 0.9rem;
            }

            .login-button {
                width: 100%;
                height: 44px;
                background: linear-gradient(90deg, #1A2C50 0%, #2d4a7c 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-family: "Montserrat", sans-serif;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 12px rgba(26, 44, 80, 0.25);
            }

            .login-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(26, 44, 80, 0.35);
            }

            .login-button:active {
                transform: translateY(0);
            }

            .login-footer {
                margin-top: 1.5rem;
                text-align: center;
                color: #666;
                font-size: 0.9rem;
            }

            .login-footer a {
                color: #1A2C50;
                text-decoration: none;
                font-weight: 600;
                transition: color 0.3s ease;
            }

            .login-footer a:hover {
                color: #2d4a7c;
                text-decoration: underline;
            }

            .logo-container {
                text-align: center;
                margin-bottom: 2rem;
            }

            .logo-container img {
                max-height: 60px;
                object-fit: contain;
            }
        </style>
    </head>
    <body>
        <header>
            <img class="logo" th:src="@{/img/blackWolfHorizontal.png}" alt="Black Wolf Cinema Logo">
        </header>

        <div class="container">
            <div class="login-card">
                <div class="logo-container">
                    <img th:src="@{/img/blackWolfHorizontal.png}" alt="Black Wolf Cinema">
                </div>

                <h1>Inicia Sesión</h1>
                <p class="subtitle">Accede a tu cuenta para continuar</p>

                <div th:if="${param.error}" class="error-alert">
                    ❌ Usuario o contraseña incorrecto
                </div>

                <div th:if="${param.logout}" class="success-alert">
                    ✓ Sesión cerrada correctamente
                </div>

                <form th:action="@{/authenticateTheUser}" method="POST">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    </div>

                    <button type="submit" class="login-button">Iniciar Sesión</button>
                </form>

                <div class="login-footer">
                    ¿No tienes cuenta? <a th:href="@{/register/showRegistrationForm}">Regístrate aquí</a>
                </div>
            </div>
        </div>

        <footer>
            <p class="footer_text">© Black Wolf Cinema 2025 - Sistema de Gestión de Cines</p>
        </footer>
    </body>
</html>
