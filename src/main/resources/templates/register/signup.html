<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Crear Cuenta</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <style>
            .signup-card {
                display: flex;
                flex-direction: column;
                overflow-y: auto;
                height: 70vh;
                background: white;
                border-radius: 12px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
                padding: 2rem;
                width: 100%;
                max-width: 520px;
                backdrop-filter: blur(6px);
            }

            .signup-card h1 {
                color: #1A2C50;
                margin-bottom: 0.25rem;
                font-size: 1.6rem;
                font-weight: 800;
            }

            .signup-card .subtitle {
                color: #666;
                margin-bottom: 1.2rem;
                font-size: 0.95rem;
            }

            form {
                gap: 0px;
            }

            .form-group {
                text-align: left;
            }

            .form-group label {
                display: block;
                margin-bottom: 0.35rem;
                color: #1A2C50;
                font-weight: 600;
                font-size: 0.93rem;
            }

            .form-group input {
                width: 100%;
                height: 40px;
                border-radius: 8px;
                border: 1.5px solid #ddd;
                padding: 0 12px;
                font-family: "Montserrat", sans-serif;
                font-size: 0.95rem;
                transition: all 0.2s ease;
            }

            .form-group input:focus {
                outline: none;
                border-color: #1A2C50;
                box-shadow: 0 0 0 4px rgba(26, 44, 80, 0.06);
                background-color: #fafbfc;
            }

            .alert-error {
                background-color: #fee;
                color: #c33;
                border: 1px solid #fcc;
                border-radius: 8px;
                padding: 0.9rem;
                margin-bottom: 0.9rem;
                font-size: 0.9rem;
            }

            .error-list {
                list-style: none;
                padding: 0;
                margin: 0.5rem 0 0 0;
            }

            .error-list li {
                background-color: #fff5f5;
                color: #9b1c1c;
                padding: 8px 10px;
                border-radius: 6px;
                border-left: 4px solid #ef4444;
                margin-bottom: 6px;
                font-size: 0.88rem;
            }

            .password-requirements {
                background: #f0f9ff;
                border: 1px solid #bfdbfe;
                border-radius: 6px;
                padding: 10px;
                margin-top: 8px;
                font-size: 0.88rem;
                color: #1e40af;
            }

            .requirement { display:flex; gap:8px; align-items:center; margin:6px 0 }
            .requirement-check { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700 }
            .requirement.met .requirement-check { background:#10b981; color:white }
            .requirement.unmet .requirement-check { background:#ef4444; color:white }

            .register-button {
                margin-top: 1.5rem;
                width: 100%;
                height: 44px;
                background: linear-gradient(90deg, #1A2C50 0%, #2d4a7c 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-family: "Montserrat", sans-serif;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: 0 6px 18px rgba(26, 44, 80, 0.12);
            }

            .register-button:disabled { opacity: 0.6; cursor: not-allowed }

            .logo-container { text-align:center; margin-bottom:1rem }
            .logo-container img { max-height:56px }

            .page-center {
                height: 100%;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:2rem
            }
        </style>
    </head>
    <body>
        <header>
            <a th:href="@{/loginPage}" class="index_link"><img class="logo" th:src="@{/img/blackWolfHorizontal.png}" alt="logo"></a>
        </header>

        <div class="page-center">
            <div class="signup-card">
                <h1>Crea tu cuenta</h1>
                <p class="subtitle">Regístrate para comprar boletos y administrar tu cuenta</p>

                <div th:if="${registrationError}" class="alert-error">
                    <strong>Error:</strong> <span th:text="${registrationError}"></span>
                </div>

                <form th:action="@{/register/processRegistrationForm}" th:object="${newUser}" method="POST" id="formulario" novalidate>

                    <div class="form-group">
                        <label for="userName">Usuario</label>
                        <input type="text" id="userName" th:field="*{userName}" placeholder="Mínimo 4 caracteres" />
                        <ul class="error-list" th:if="${#fields.hasErrors('userName')}">
                            <li th:each="err : ${#fields.errors('userName')}" th:text="'❌ ' + ${err}"></li>
                        </ul>
                    </div>

                    <div class="form-group">
                        <label for="firstName">Nombre</label>
                        <input type="text" id="firstName" th:field="*{firstName}" placeholder="Solo letras" />
                        <ul class="error-list" th:if="${#fields.hasErrors('firstName')}">
                            <li th:each="err : ${#fields.errors('firstName')}" th:text="'❌ ' + ${err}"></li>
                        </ul>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Apellido</label>
                        <input type="text" id="lastName" th:field="*{lastName}" placeholder="Solo letras" />
                        <ul class="error-list" th:if="${#fields.hasErrors('lastName')}">
                            <li th:each="err : ${#fields.errors('lastName')}" th:text="'❌ ' + ${err}"></li>
                        </ul>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="ejemplo@correo.com" />
                        <ul class="error-list" th:if="${#fields.hasErrors('email')}">
                            <li th:each="err : ${#fields.errors('email')}" th:text="'❌ ' + ${err}"></li>
                        </ul>
                    </div>

                    <div class="form-group">
                        <label for="passwordInput">Contraseña</label>
                        <input type="password" id="passwordInput" th:field="*{password}" placeholder="Mínimo 8 caracteres con letras y números" />
                        <ul class="error-list" th:if="${#fields.hasErrors('password')}">
                            <li th:each="err : ${#fields.errors('password')}" th:text="${err}"></li>
                        </ul>

                        <div class="password-requirements" id="passwordRequirements" style="display:none;">
                            <div class="requirement unmet" id="req-length"><span class="requirement-check">✓</span><span>Al menos 8 caracteres</span></div>
                            <div class="requirement unmet" id="req-letters"><span class="requirement-check">✓</span><span>Contiene letras</span></div>
                            <div class="requirement unmet" id="req-numbers"><span class="requirement-check">✓</span><span>Contiene números</span></div>
                        </div>
                    </div>

                    <button type="submit" class="register-button" id="submitBtn" disabled>Registrar</button>
                </form>
            </div>
        </div>

        <footer>
            <p class="footer_text">Black Wolf Cinema ®</p>
        </footer>

        <script th:src="@{/js/app.js}"></script>
        <script>
            const passwordInput = document.getElementById('passwordInput');
            const passwordRequirements = document.getElementById('passwordRequirements');
            const reqLength = document.getElementById('req-length');
            const reqLetters = document.getElementById('req-letters');
            const reqNumbers = document.getElementById('req-numbers');
            const submitBtn = document.getElementById('submitBtn');

            if (passwordInput) {
                passwordInput.addEventListener('focus', function() { passwordRequirements.style.display = 'block'; });

                passwordInput.addEventListener('input', function() {
                    const password = this.value;
                    let allMet = true;

                    if (password.length >= 8) { reqLength.classList.remove('unmet'); reqLength.classList.add('met'); } else { reqLength.classList.remove('met'); reqLength.classList.add('unmet'); allMet = false; }
                    if (/[a-zA-Z]/.test(password)) { reqLetters.classList.remove('unmet'); reqLetters.classList.add('met'); } else { reqLetters.classList.remove('met'); reqLetters.classList.add('unmet'); allMet = false; }
                    if (/[0-9]/.test(password)) { reqNumbers.classList.remove('unmet'); reqNumbers.classList.add('met'); } else { reqNumbers.classList.remove('met'); reqNumbers.classList.add('unmet'); allMet = false; }

                    submitBtn.disabled = !allMet;
                });
            }

            document.getElementById('formulario').addEventListener('submit', function(e) {
                const firstName = document.querySelector('input[name="firstName"]').value.trim();
                const lastName = document.querySelector('input[name="lastName"]').value.trim();

                if (!/^[a-záéíóúñA-ZÁÉÍÓÚÑ\s]*$/.test(firstName) || firstName === '') {
                    e.preventDefault(); alert('El nombre solo debe contener caracteres alfabéticos'); return;
                }
                if (!/^[a-záéíóúñA-ZÁÉÍÓÚÑ\s]*$/.test(lastName) || lastName === '') {
                    e.preventDefault(); alert('El apellido solo debe contener caracteres alfabéticos'); return;
                }
            });
        </script>
    </body>
</html>
