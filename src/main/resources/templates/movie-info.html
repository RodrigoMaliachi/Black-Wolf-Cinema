<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${movie.name} + ' - Black Wolf Cinema'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .movie-hero {
            background: linear-gradient(135deg, #1A2C50 0%, #2d4a7c 100%);
            color: white;
            padding: 60px 20px 30px;
            margin-bottom: 0;
            position: relative;
            overflow: hidden;
        }

        .movie-hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,50 Q300,0 600,50 T1200,50 L1200,120 L0,120 Z" fill="rgba(255,255,255,0.05)"/></svg>') repeat-x;
            background-size: 600px 120px;
        }

        .movie-detail-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .movie-detail-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 50px;
            margin-bottom: 60px;
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            margin-top: -80px;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .movie-detail-wrapper {
                grid-template-columns: 300px 1fr;
                gap: 60px;
            }
        }

        .movie-poster {
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
            max-width: 300px;
            margin: 0 auto;
            transition: all 0.4s ease;
            background: linear-gradient(135deg, rgba(26, 44, 80, 0.1) 0%, rgba(45, 74, 124, 0.1) 100%);
            aspect-ratio: 9/13;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-poster:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .movie-poster-fallback {
            font-size: 100px;
            opacity: 0.2;
            text-align: center;
        }

        .movie-info-section {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .movie-title {
            color: #1A2C50;
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0;
            line-height: 1.15;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .movie-synopsis {
            color: #555;
            font-size: 1.05rem;
            line-height: 1.8;
            background: linear-gradient(90deg, rgba(26, 44, 80, 0.05) 0%, rgba(45, 74, 124, 0.05) 100%);
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #1A2C50;
            font-style: italic;
        }

        .movie-meta {
            display: flex;
            gap: 35px;
            flex-wrap: wrap;
            padding: 28px;
            background: linear-gradient(135deg, #1A2C50 0%, #2d4a7c 100%);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(26, 44, 80, 0.2);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .meta-label {
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .meta-value {
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .buttons-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn-trailer {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
            border: none;
            cursor: pointer;
            font-family: "Montserrat", sans-serif;
            font-size: 0.95rem;
        }

        .btn-trailer:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        }

        .btn-tickets {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #1A2C50 0%, #2d4a7c 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(26, 44, 80, 0.3);
            border: none;
            cursor: pointer;
            font-family: "Montserrat", sans-serif;
            font-size: 0.95rem;
        }

        .btn-tickets:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(26, 44, 80, 0.4);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 1rem;
            position: relative;
            z-index: 5;
        }

        .back-button:hover {
            opacity: 0.85;
            transform: translateX(-4px);
        }

        @media (max-width: 767px) {
            .movie-title {
                font-size: 2rem;
            }

            .movie-detail-wrapper {
                gap: 30px;
                padding: 35px 20px;
                margin-top: -60px;
            }

            .buttons-section {
                flex-direction: column;
            }

            .btn-trailer,
            .btn-tickets {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <a th:href="@{/}" class="index_link"><img class="logo" th:src="@{/img/blackWolfHorizontal.png}" alt="Black Wolf Cinema Logo"></a>
        <nav>
            <ul class="nav_links">
                <li class="nav_item"><p class="userName">Bienvenido <span sec:authentication="principal.username"></span></p></li>
                <li>
                    <form action="#" th:action="@{/logout}" method="POST">
                        <input type="submit" value="Cerrar Sesión" class="cerrar-sesion"/>
                    </form>
                </li>
            </ul>
        </nav>
    </header>

    <div class="movie-hero">
        <div class="movie-detail-container">
            <a th:href="@{/}" class="back-button">Volver a la Cartelera</a>
        </div>
    </div>

    <div class="movie-detail-container">
        <div class="movie-detail-wrapper" th:object="${movie}">
            <!-- Poster -->
            <div class="movie-poster">
                <img th:src="@{/assets/{filename}(filename=*{imagePath})}"
                    th:alt="*{name}"
                    onerror="this.style.display='none'; document.querySelector('.movie-poster-fallback').style.display='block'"
                >
                <div class="movie-poster-fallback" style="display: none;"></div>
            </div>

            <!-- Info -->
            <div class="movie-info-section">
                <h1 class="movie-title" th:text="*{name}"></h1>

                <div class="movie-synopsis" th:text="*{synopsis}"></div>

                <div class="movie-meta">
                    <div class="meta-item">
                        <span class="meta-label">Duración</span>
                        <span class="meta-value" th:text="*{duration} + ' minutos'"></span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="buttons-section">
                    <a th:if="*{trailer} != null and *{trailer} != ''" 
                       th:href="*{trailer}" 
                       target="_blank" 
                       class="btn-trailer">
                        ▶ Ver Tráiler
                    </a>
                    <a th:href="@{/show/{id}(id=*{id})}" class="btn-tickets">
                        Comprar Boletos
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="footer_text">© Black Wolf Cinema 2025 - Sistema de Gestión de Cines</p>
    </footer>
</body>
</html>
