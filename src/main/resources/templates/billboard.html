<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Cartelera - Black Wolf Cinema</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <style>
            .billboard-section {
                display: flex;
                flex-direction: column;
                overflow: auto;
                min-height: calc(100vh - 200px);
                padding: 40px 20px;
            }

            .billboard-title {
                text-align: center;
                margin-bottom: 40px;
                color: #1A2C50;
                font-size: 2.5rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 2px;
            }

            .admin-panel {
                margin-bottom: 30px;
                background: linear-gradient(90deg, rgba(26, 44, 80, 0.05) 0%, rgba(45, 74, 124, 0.05) 100%);
                padding: 20px;
                border-radius: 12px;
                border-left: 4px solid #1A2C50;
            }

            .admin-menu-button {
                background: linear-gradient(90deg, #1A2C50 0%, #2d4a7c 100%);
                color: white;
                border: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                font-family: "Montserrat", sans-serif;
                font-size: 0.95rem;
                transition: all 0.3s ease;
                box-shadow: 0 4px 12px rgba(26, 44, 80, 0.25);
            }

            .admin-menu-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(26, 44, 80, 0.35);
            }

            .admin-menu-button:active {
                transform: translateY(0);
            }

            .role-container {
                background: white;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
                padding: 30px;
                margin: 20px 0;
                display: none;
            }

            .role-container.visible {
                display: block;
                animation: slideDown 0.3s ease;
            }

            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .role-container ul {
                display: flex;
                flex-direction: column;
                gap: 15px;
                list-style: none;
            }

            .role-container li {
                margin: 0;
            }

            .role-container a {
                display: inline-block;
                background: linear-gradient(90deg, #1A2C50 0%, #2d4a7c 100%);
                color: white;
                text-decoration: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-weight: 600;
                font-size: 0.95rem;
                transition: all 0.3s ease;
                box-shadow: 0 4px 12px rgba(26, 44, 80, 0.25);
            }

            .role-container a:hover {
                transform: translateX(4px);
                box-shadow: 0 6px 20px rgba(26, 44, 80, 0.35);
            }

            .cerrar-menu {
                background: #6b7280;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                font-family: "Montserrat", sans-serif;
                transition: all 0.3s ease;
            }

            .cerrar-menu:hover {
                background: #4b5563;
                transform: translateY(-2px);
            }

            .movie-container {
                display: grid;
                grid-template-columns: 1fr;
                gap: 30px;
                max-width: 1400px;
                margin: 0 auto;
            }

            @media (min-width: 768px) {
                .movie-container {
                    grid-template-columns: repeat(2, 1fr);
                    gap: 30px;
                }
            }

            @media (min-width: 1024px) {
                .movie-container {
                    grid-template-columns: repeat(3, 1fr);
                    gap: 40px;
                }
            }

            @media (min-width: 1400px) {
                .movie-container {
                    grid-template-columns: repeat(4, 1fr);
                    gap: 40px;
                }
            }

            .movie-card {
                background: white;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
                display: flex;
                flex-direction: column;
                height: 100%;
            }

            .movie-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            }

            .movie-image-wrapper {
                width: 100%;
                height: 400px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, rgba(26, 44, 80, 0.1) 0%, rgba(45, 74, 124, 0.1) 100%);
                position: relative;
                overflow: hidden;
            }

            .movie-image {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .movie-image.no-image {
                display: none;
            }

            .movie-image-fallback {
                position: absolute;
                font-size: 80px;
                opacity: 0.4;
                z-index: 1;
            }

            .movie-info {
                padding: 20px;
                display: flex;
                flex-direction: column;
                flex: 1;
            }

            .movie-title {
                color: #1A2C50;
                font-size: 1.1rem;
                font-weight: 700;
                margin-bottom: 15px;
                line-height: 1.3;
                min-height: 60px;
                display: flex;
                align-items: center;
            }

            .movie-action {
                margin-top: auto;
            }

            .btn-ver-mas {
                display: inline-block;
                width: 100%;
                text-decoration: none;
                padding: 12px 20px;
                border-radius: 8px;
                background: linear-gradient(90deg, #1A2C50 0%, #2d4a7c 100%);
                color: white;
                font-weight: 600;
                text-align: center;
                transition: all 0.3s ease;
                box-shadow: 0 4px 12px rgba(26, 44, 80, 0.25);
                cursor: pointer;
                border: none;
                font-family: "Montserrat", sans-serif;
                font-size: 0.95rem;
            }

            .btn-ver-mas:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(26, 44, 80, 0.35);
            }

            .btn-ver-mas:active {
                transform: translateY(0);
            }

            .hidden {
                display: none;
            }

            @media (min-width: 768px) {
                .admin-panel {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }

                .abrir-menu, .cerrar-menu {
                    display: none;
                }

                .role-container {
                    display: block !important;
                    padding: 0;
                    background: transparent;
                    box-shadow: none;
                    margin: 0;
                    border-left: none;
                }

                .role-container ul {
                    flex-direction: row;
                    gap: 10px;
                    justify-content: center;
                }

                .role-container li {
                    display: inline-block;
                }
            }

            @media (max-width: 767px) {
                .abrir-menu {
                    display: block;
                }

                .billboard-title {
                    font-size: 1.8rem;
                    margin-bottom: 30px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <a th:href="@{/}" class="index_link"><img class="logo" th:src="@{/img/blackWolfHorizontal.png}" alt="Black Wolf Cinema Logo"></a>
            <nav>
                <ul class="nav_links">
                    <li class="nav_item"><p class="userName">Bienvenido <span sec:authentication="principal.username"></span></p></li>
                    <li>
                        <form action="#" th:action="@{/logout}" method="POST">
                            <input type="submit" value="Cerrar Sesión" class="cerrar-sesion"/>
                        </form>
                    </li>
                </ul>
            </nav>
        </header>

        <div class="billboard-section">
            <!-- Admin Panel -->
            <div class="admin-panel" sec:authorize="hasRole('ADMIN')">
                <button class="admin-menu-button abrir-menu">
                    ☰ Menú Administrativo
                </button>
                <nav id="nav-admin" class="role-container">
                    <ul>
                        <li><a th:href="@{/admin/listMovies}">Panel de Películas</a></li>
                        <li><a th:href="@{/admin/listShows}">Panel de Funciones</a></li>
                        <li><a th:href="@{/admin/receipt}">Reporte</a></li>
                        <li><button class="cerrar-menu">Cerrar</button></li>
                    </ul>
                </nav>
            </div>

            <!-- Cartelera Título -->
            <h1 class="billboard-title">Cartelera de Películas</h1>

            <!-- Movies Container -->
            <div class="movie-container">
                <div class="movie-card" th:each="movie : ${movies}" th:object="${movie}">
                    <div class="movie-image-wrapper">
                        <img class="movie-image"
                            th:src="@{/assets/{filename}(filename=*{imagePath})}"
                            th:alt="*{name}"
                            onerror="this.classList.add('no-image')"
                        >
                        <div class="movie-image-fallback" th:if="${movie.imagePath == null or movie.imagePath == ''}">
                            
                        </div>
                        <div class="movie-image-fallback" style="display: none;" id="fallback-icon">
                            
                        </div>
                    </div>
                    <div class="movie-info">
                        <h2 class="movie-title" th:text="*{name}"></h2>
                        <div class="movie-action">
                            <a th:href="@{/movies/{id}(id=*{id})}" class="btn-ver-mas">
                                Ver Detalles y Comprar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p class="footer_text">© Black Wolf Cinema 2025 - Sistema de Gestión de Cines</p>
        </footer>

        <script>
            const navAdmin = document.querySelector('#nav-admin');
            const btnAbrir = document.querySelector('.abrir-menu');
            const btnCerrar = document.querySelector('.cerrar-menu');

            if (btnAbrir) {
                btnAbrir.addEventListener('click', () => {
                    navAdmin.classList.add('visible');
                });
            }

            if (btnCerrar) {
                btnCerrar.addEventListener('click', () => {
                    navAdmin.classList.remove('visible');
                });
            }

            // Mostrar ícono de fallback cuando la imagen no carga
            document.querySelectorAll('.movie-image').forEach(img => {
                img.addEventListener('error', function() {
                    const wrapper = this.parentElement;
                    const fallback = wrapper.querySelector('.movie-image-fallback:not(.no-image)');
                    if (fallback) {
                        fallback.style.display = 'block';
                    }
                });

                // Si la imagen está vacía o no existe, mostrar el fallback
                if (!this.src || this.src.includes('undefined') || this.src.includes('null')) {
                    const wrapper = this.parentElement;
                    const fallback = wrapper.querySelector('.movie-image-fallback');
                    if (fallback) {
                        fallback.style.display = 'block';
                    }
                }
            });
        </script>

    </body>
</html>
